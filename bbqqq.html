<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>QWERTY 文案庫</title>
  <link rel="icon" href="IMG_9763-removebg-preview.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f6f6;
    }

    /* ===== 首頁 ===== */
    .home {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .home h1 {
      margin-bottom: 10px;
    }

    .home-grid {
      display: grid;
      grid-template-columns: repeat(3, 180px);
      gap: 20px;
    }

    .home-btn {
      background: black;
      color: white;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
    }

    .home-btn:hover {
      opacity: 0.8;
    }

    /* ===== 主頁 ===== */
    .container {
      display: none;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #111;
      color: white;
      padding: 20px;
      box-sizing: border-box;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .category {
      cursor: pointer;
      margin: 8px 0;
      font-size: 14px;
      opacity: 0.7;
    }

    .category.active,
    .category:hover {
      opacity: 1;
      font-weight: bold;
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .quote {
      background: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .quote span {
      flex: 1;
      font-size: 14px;
    }

    .quote button {
      border: none;
      background: black;
      color: white;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
    }

    .basket {
      width: 260px;
      background: #eee;
      padding: 20px;
      box-sizing: border-box;
    }

    .basket-item {
      background: white;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 13px;
      position: relative;
    }

    .basket-item button {
      position: absolute;
      right: 6px;
      top: 6px;
      border: none;
      background: none;
      cursor: pointer;
    }

    .copy-all {
      width: 100%;
      padding: 8px;
      background: black;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<!-- ===== 首頁 ===== -->
<div class="home" id="home">
  <h1>QWERTY 文案庫</h1>
  <div class="home-grid">
    <div class="home-btn" onclick="enterSite('idol')">追星語錄</div>
    <div class="home-btn" onclick="enterSite('love')">戀愛文案</div>
    <div class="home-btn" onclick="enterSite('selfie')">自拍文案</div>
    <div class="home-btn" onclick="enterSite('good')">誇人語錄</div>
    <div class="home-btn" onclick="enterSite('winter')">冬天文案</div>
    <div class="home-btn" onclick="enterSite('ceo')">霸道語錄</div>
  </div>
</div>

<!-- ===== 主站 ===== -->
<div class="container" id="site">

  <div class="sidebar">
    <h2>語錄分類</h2>
    <div class="category" onclick="showCategory('idol', this)">追星語錄</div>
    <div class="category" onclick="showCategory('love', this)">戀愛文案</div>
    <div class="category" onclick="showCategory('selfie', this)">自拍文案</div>
    <div class="category" onclick="showCategory('good', this)">誇人語錄</div>
    <div class="category" onclick="showCategory('winter', this)">冬天文案</div>
    <div class="category" onclick="showCategory('ceo', this)">霸道語錄</div>
  </div>

  <div class="content" id="content"></div>

  <div class="basket">
    <h3>取用區</h3>
    <div id="basketList"></div>
    <button class="copy-all" onclick="copyAll()">複製全部</button>
  </div>

</div>

let currentCategory = "idol";
const content = document.getElementById("content");
const basketList = document.getElementById("basketList");

function enterSite(cat) {
  document.getElementById("home").style.display = "none";
  document.getElementById("site").style.display = "flex";
  currentCategory = cat;
  renderQuotes();
}

function showCategory(cat, el) {
  currentCategory = cat;
  document.querySelectorAll(".category").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  renderQuotes();
}

function renderQuotes() {
  content.innerHTML = "";
  data[currentCategory].forEach(q => {
    const div = document.createElement("div");
    div.className = "quote";

    const span = document.createElement("span");
    span.textContent = q;

    const addBtn = document.createElement("button");
    addBtn.textContent = "加入";
    addBtn.onclick = () => addToBasket(q);

    const copyBtn = document.createElement("button");
    copyBtn.textContent = "複製";
    copyBtn.onclick = () => navigator.clipboard.writeText(q);

    div.append(span, addBtn, copyBtn);
    content.appendChild(div);
  });
}

function addToBasket(text) {
  const div = document.createElement("div");
  div.className = "basket-item";
  div.textContent = text;

  const del = document.createElement("button");
  del.textContent = "✕";
  del.onclick = () => div.remove();

  div.appendChild(del);
  basketList.appendChild(div);
}

function copyAll() {
  const texts = [...basketList.children].map(d => d.textContent.replace("✕",""));
  navigator.clipboard.writeText(texts.join("\n"));
}
</script>

</body>
</html>
