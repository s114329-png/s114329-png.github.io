  <!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>QWERTY</title>
    <link rel="icon" href="IMG_9763-removebg-preview.png">
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f6f6f6;
      }

      .container {
        display: flex;
        height: 100vh;
      }

      /* 左側分類 */
      .sidebar {
        width: 220px;
        background: #111;
        color: white;
        padding: 20px;
        box-sizing: border-box;
      }

      .sidebar h2 {
        font-size: 18px;
        margin-bottom: 10px;
      }

      .category {
        cursor: pointer;
        margin: 8px 0;
        font-size: 14px;
        opacity: 0.8;
      }

      .category:hover,
      .category.active {
        opacity: 1;
        font-weight: bold;
      }

      /* 中間語錄 */
      .content {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
      }

      .quote {
        background: white;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .quote span {
        flex: 1;
        font-size: 14px;
      }

      .quote button {
        border: none;
        background: #000;
        color: white;
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 12px;
      }

      /* 右側取用區 */
      .basket {
        width: 260px;
        background: #eee;
        padding: 20px;
        box-sizing: border-box;
      }

      .basket h2 {
        font-size: 16px;
        margin-bottom: 10px;
      }

      .basket-item {
        background: white;
        padding: 8px;
        margin-bottom: 8px;
        border-radius: 4px;
        font-size: 13px;
        position: relative;
      }

      .basket-item button {
        position: absolute;
        right: 6px;
        top: 6px;
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 12px;
      }

      .copy-all {
        width: 100%;
        margin-top: 10px;
        padding: 8px;
        background: black;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- 左側 -->
      <div class="sidebar">
        <h2>語錄分類</h2>
        <div class="category active" onclick="showCategory('idol', this)">追星語錄</div>
        <div class="category" onclick="showCategory('literary', this)">文青語錄</div>
        <div class="category" onclick="showCategory('love', this)">戀愛文案</div>
        <div class="category" onclick="showCategory('selfie', this)">發自己照片的語錄</div>
        <div class="category" onclick="showCategory('wow', this)">花式誇人語錄</div>
        <div class="category" onclick="showCategory('good', this)">正常誇人語錄</div>
        <div class="category" onclick="showCategory('winter', this)">冬天文案</div>
        <div class="category" onclick="showCategory('playboy', this)">渣男/女語錄</div>
        <div class="category" onclick="showCategory('ceo', this)">霸道語錄</div>
      </div>

      <!-- 中間 -->
      <div class="content" id="content"></div>

      <!-- 右側 -->
      <div class="basket">
        <h2>取用區</h2>
        <div id="basketList"></div>
        <button class="copy-all" onclick="copyAll()">複製全部</button>
      </div>
    </div>

    <script>
      const data = {
        idol: [
          "微微顫抖的鏡頭 是我呼之欲出的心跳",
          "彩帶落下的瞬間 我也站在幸福裡",
          "燈光打在你身上 被照亮的人卻是我",
          "你走出螢幕 我摘下耳機",
          "這次眼睛比手機先看見你",
      	  "我也願意做你的頭號支持者",
      	  "漂亮的眼睛要留幸福的淚",
      	  "買了你的周邊 就好像你在我周邊",
      	  "人不能靠一個瞬間活一輩子 可那個瞬間裡有你",
	        "你給了我翻山越嶺的勇氣",
      	  "賣貨便的38塊是你來我家裡的車馬費",
      	  "你是我世界裡溫暖的小屋 那裏有著趕走壞心情的魔法 和把哭臉染成笑容的超能力",
          "下次我們的雙眸 會映有同一片風景",
	        "定格 讓幸福具象化",
	        "追逐星光的人 也會身披萬丈光芒",
      	  "世界在下沉 我在追逐星星",
	        "因為你 我第一次想成為這麼好的人",
      	  "走你走過的路 我們算不算相逢"
	        "你是我千萬個心碎的理由 也是從黑暗中拉出我的那雙手"
        ],
        literary: [
          "生活本來就不完美，但很值得。",
          "文字是我和世界保持距離的方式。",
          "今天也在慢慢喜歡自己。"
        ],
        love: [
          "瞳孔與心的距離 在與你對視時清零",
          "不是因為天氣晴朗才愛你 是因為愛你所以雨天也是好天氣"",
          "生命中給了我數不清的積雪 而你是我遇到的第一個春天",
	        "你笑臉盈盈的樣子好可愛 好想把全世界都給你",
      	  "幸福不說話 卻在平淡中生根發芽",
      	  "愛你的話說出口了卻總覺得不足 於是化成一句句回家小心",
      	  "擁抱你 就是擁抱我的全世界",
      	  "民以食為天 我以你為先",
      	  "永遠太遠 所以我們約定明天見",
      	  "要不要跟我出去走一走 你想牽的那雙手 就是我 這次就別再說沒空",
      	  "那些想念你的瞬間太美 惹的繆斯都翹起了嘴",
      	  "喜歡怎麼藏 悸動怎麼涼",
      	  "把嘴堵上 情話留在嘴裡邊也無妨",
      	  "那份悸動 整個宇宙的美好只屬於你和我",
      	  "能不能 讓這份邂逅沒有盡頭",
      	  "以後別做朋友 做我的初戀",
      	  "你的天空是灰色的 讓我為你添加一些快樂",
      	  "我們現在就像是青春電影的某一幕",
      	  "天使栽了跟斗 噢墜落墜落 告別了雲朵跌在我的心頭",
        ],
        selfie: [
          "你一靠近，我就忘了退後。",
          "喜歡不是佔有，是忍不住心軟。",
          "我把溫柔都留給你。"
        ],
        wow: [
          "你一靠近，我就忘了退後。",
          "喜歡不是佔有，是忍不住心軟。",
          "我把溫柔都留給你。"
        ],
        good: [
          "想了好多漂亮話 結果發現最漂亮的是你",
          "喜歡不是佔有，是忍不住心軟。",
          "我把溫柔都留給你。"
        ],
       winter: [
          "比冬天先來臨的是你炙熱的手心和溫暖的擁抱",
          "我的心降臨在有你的冬天",
          "銀白色的情節 噢溫柔溫柔 從來沒想過會不只是聽說"
        ],
       playboy: [
          "你一靠近，我就忘了退後。",
          "喜歡不是佔有，是忍不住心軟。",
          "我把溫柔都留給你。"
        ],
       ceo: [
          "你一靠近，我就忘了退後。",
          "喜歡不是佔有，是忍不住心軟。",
          "我把溫柔都留給你。"
        ],
      };

      let currentCategory = "mean";
      const content = document.getElementById("content");
      const basketList = document.getElementById("basketList");

      function showCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll(".category").forEach(c => c.classList.remove("active"));
        event.target.classList.add("active");
        renderQuotes();
      }

      function renderQuotes() {
        content.innerHTML = "";
        data[currentCategory].forEach(q => {
          const div = document.createElement("div");
          div.className = "quote";

          const span = document.createElement("span");
          span.textContent = q;

          const addBtn = document.createElement("button");
          addBtn.textContent = "加入";
          addBtn.onclick = () => addToBasket(q);

          const copyBtn = document.createElement("button");
          copyBtn.textContent = "複製";
          copyBtn.onclick = () => copyText(q);

          div.append(span, addBtn, copyBtn);
          content.appendChild(div);
        });
      }

      function addToBasket(text) {
        const div = document.createElement("div");
        div.className = "basket-item";
        div.textContent = text;

        const del = document.createElement("button");
        del.textContent = "✕";
        del.onclick = () => div.remove();

        div.appendChild(del);
        basketList.appendChild(div);
      }

      function copyText(text) {
        navigator.clipboard.writeText(text);
        alert("已複製！");
      }

      function copyAll() {
        const texts = [...basketList.children].map(d => d.textContent.replace("✕", ""));
        navigator.clipboard.writeText(texts.join("\n"));
        alert("全部已複製！");
      }

      renderQuotes();
    </script>
  </body>
</html>
